name: atoms-workbench
services:
  sandbox-image:
    profiles: [tools]
    image: atoms-sandbox:local
    build: ./sandbox
    entrypoint: ['true']
  api:
    image: atoms-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file: ${ATOMS_ENV_FILE:-../.env.local}
    environment:
      PORT: 8787
      BUILD_SHA: ${BUILD_SHA:-development}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    image: atoms-server:local
    user: root
    command: ['npm', 'run', 'worker']
    env_file: ${ATOMS_ENV_FILE:-../.env.local}
    environment:
      SANDBOX_ROOT: /var/lib/atoms-builds
      SANDBOX_IMAGE: atoms-sandbox:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/atoms-builds:/var/lib/atoms-builds
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        BUILD_SHA: ${BUILD_SHA:-development}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['caddy_data:/data', 'caddy_config:/config']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
