name: Deploy web preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: 'true'
          VITE_STATIC_PREVIEW: 'true'
          VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:online
        env:
          VERIFY_URL: ${{ needs.deploy.outputs.url }}
          VERIFY_STATIC_ONLY: 'true'
          VERIFY_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERIFY_API_URL: ${{ vars.VITE_API_URL }}
          VERIFY_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      - name: Prepare a confirmed acceptance account (no email or model calls)
        if: vars.VITE_SUPABASE_URL != ''
        run: npm run prepare:auth
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTH_TEST_SUPABASE_SECRET }}
      - name: Install Auth browser
        if: vars.VITE_SUPABASE_URL != ''
        run: npx playwright install --with-deps chromium
      - name: Verify live login, session persistence and registration form
        if: vars.VITE_SUPABASE_URL != ''
        run: npm run test:auth
        env:
          VERIFY_URL: ${{ needs.deploy.outputs.url }}
      - name: Remove synthetic acceptance account
        if: always() && vars.VITE_SUPABASE_URL != ''
        run: node scripts/cleanup-auth-fixture.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTH_TEST_SUPABASE_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-online-verification
          path: |
            .artifacts/online-verification.json
            .artifacts/auth-verification.json
