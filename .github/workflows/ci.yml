name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:secrets
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -t atoms-sandbox:local deploy/sandbox
      - run: node --import tsx scripts/test-sandbox.mjs
      - run: node scripts/test-database.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/sandbox.spec.ts
      - run: docker build -t atoms-server:ci -f deploy/Dockerfile.server .
      - run: docker build -t atoms-web:ci -f deploy/Dockerfile.web .
